<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gönüllü Girişi – Deprem Sistemi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a3a5c 0%, #2d6a9f 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }
    .giris-kart {
      background: #fff; border-radius: 20px;
      padding: 44px 40px; width: 100%; max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,.2);
    }
    .form-control { border-radius: 10px; padding: 11px 14px; border: 1.5px solid #d1d5db; }
    .form-control:focus { border-color: #2d6a9f; box-shadow: 0 0 0 3px rgba(45,106,159,.15); }
    .form-label { font-weight: 600; font-size: .9rem; color: #374151; }
    .btn-giris {
      background: linear-gradient(135deg, #1a3a5c, #2d6a9f);
      color: #fff; border: none; border-radius: 10px;
      padding: 12px 0; font-weight: 700; font-size: 1rem; width: 100%;
      transition: all .2s;
    }
    .btn-giris:hover { opacity: .9; color: #fff; }
  </style>
</head>
<body>
  <div class="giris-kart">
    <div class="text-center mb-4">
      <div style="font-size: 3rem;">🙋</div>
      <h4 class="fw-bold mt-2" style="color:#1a3a5c;">Gönüllü Girişi</h4>
      <p class="text-muted" style="font-size:.9rem;">Panelinize erişmek için giriş yapın</p>
    </div>

    <div id="alertBox" class="alert d-none mb-3"></div>

    <div class="mb-3">
      <label class="form-label">E-posta</label>
      <input type="email" id="email" class="form-control" placeholder="ornek@mail.com" />
    </div>
    <div class="mb-4">
      <label class="form-label">Şifre</label>
      <input type="password" id="sifre" class="form-control" placeholder="Şifreniz" />
    </div>

    <button class="btn-giris" onclick="girisYap()">
      <i class="bi bi-box-arrow-in-right me-2"></i>Giriş Yap
    </button>

    <div class="text-center mt-3">
      <a href="index.html" class="text-muted text-decoration-none" style="font-size:.85rem;">
        <i class="bi bi-arrow-left me-1"></i>Kayıt sayfasına dön
      </a>
    </div>
  </div>

<script>
  const API = "http://localhost:5000/api";

  async function girisYap() {
    const alertBox = document.getElementById("alertBox");
    alertBox.className = "alert d-none";

    const email = document.getElementById("email").value.trim();
    const sifre = document.getElementById("sifre").value.trim();

    if (!email || !sifre) {
      alertBox.className = "alert alert-danger";
      alertBox.textContent = "E-posta ve şifre zorunludur.";
      return;
    }

    try {
      const res  = await fetch(`${API}/kullanici-giris`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, sifre })
      });
      const data = await res.json();

      if (!res.ok) {
        alertBox.className = "alert alert-danger";
        alertBox.textContent = data.hata || "Giriş başarısız.";
        return;
      }

      // Kullanıcı bilgisini sakla ve panele yönlendir
      localStorage.setItem("gonullu", JSON.stringify(data));
      window.location.href = "panel.html";

    } catch(e) {
      alertBox.className = "alert alert-danger";
      alertBox.textContent = "Sunucuya bağlanılamadı.";
    }
  }

  // Enter tuşu
  document.addEventListener("keydown", e => {
    if (e.key === "Enter") girisYap();
  });
</script>
</body>
</html>
